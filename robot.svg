<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <!-- A friendly hovering robot that waves hello: purple body, glowing blinking eyes, rosy cheeks,
       a beating orange heart and a softly glowing antenna bulb. -->
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9ccfd"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b2a6b"/>
      <stop offset="1" stop-color="#1e1640"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ffb47a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff6600" stop-opacity="0"/>
    </radialGradient>
    <style>
      .hover { animation: hover 2.6s ease-in-out infinite; }
      .shadow { animation: shadow 2.6s ease-in-out infinite; transform-origin: 80px 150px; }
      .wave { animation: wave 1.6s ease-in-out infinite; transform-origin: 116px 96px; }
      .eye { animation: blink 4s infinite; transform-origin: center; transform-box: fill-box; }
      .heart { animation: beat 1.3s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      .bulb { animation: bulb 1.8s ease-in-out infinite; }
      @keyframes hover { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      @keyframes shadow { 0%, 100% { transform: scaleX(1); opacity: 0.35; } 50% { transform: scaleX(0.8); opacity: 0.2; } }
      @keyframes wave { 0%, 100% { transform: rotate(22deg); } 50% { transform: rotate(48deg); } }
      @keyframes blink { 0%, 44%, 50%, 100% { transform: scaleY(1); } 47% { transform: scaleY(0.1); } }
      @keyframes beat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.25); } 30% { transform: scale(1); } 45% { transform: scale(1.15); } }
      @keyframes bulb { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .hover, .shadow, .wave, .eye, .heart, .bulb { animation: none; } }
    </style>
  </defs>

  <ellipse class="shadow" cx="80" cy="150" rx="30" ry="5" fill="#6833F7" opacity="0.35"/>

  <g class="hover">
    <!-- antenna -->
    <line x1="80" y1="30" x2="80" y2="16" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round"/>
    <circle class="bulb" cx="80" cy="13" r="10" fill="url(#glow)"/>
    <circle cx="80" cy="13" r="4.5" fill="#ff6600"/>

    <!-- left arm (resting) -->
    <rect x="34" y="88" width="12" height="30" rx="6" fill="url(#shell)" transform="rotate(14 40 92)"/>

    <!-- waving arm -->
    <g class="wave">
      <rect x="110" y="62" width="12" height="34" rx="6" fill="url(#shell)"/>
      <circle cx="116" cy="60" r="8" fill="#c4b1fb"/>
    </g>

    <!-- body -->
    <rect x="46" y="80" width="68" height="52" rx="22" fill="url(#shell)"/>
    <path class="heart" d="M80 113 l-8 -8 a4.6 4.6 0 0 1 8 -5 a4.6 4.6 0 0 1 8 5 z" fill="#ff6600"/>

    <!-- head -->
    <rect x="40" y="28" width="80" height="58" rx="26" fill="url(#shell)"/>
    <rect x="49" y="39" width="62" height="36" rx="18" fill="url(#visor)"/>
    <!-- eyes -->
    <ellipse class="eye" cx="67" cy="55" rx="6" ry="7.5" fill="#e0fbff"/>
    <ellipse class="eye" cx="93" cy="55" rx="6" ry="7.5" fill="#e0fbff"/>
    <circle cx="69" cy="52" r="1.8" fill="#ffffff"/>
    <circle cx="95" cy="52" r="1.8" fill="#ffffff"/>
    <!-- smile and cheeks -->
    <path d="M74 66 q6 5 12 0" fill="none" stroke="#e0fbff" stroke-width="2.4" stroke-linecap="round"/>
    <ellipse cx="57" cy="66" rx="5" ry="3" fill="#ff8a3d" opacity="0.55"/>
    <ellipse cx="103" cy="66" rx="5" ry="3" fill="#ff8a3d" opacity="0.55"/>
  </g>
</svg>
